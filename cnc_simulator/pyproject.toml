[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-cncsim"
version = "0.1.0"
description = "Conservative three-axis stock-removal simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "trimesh>=4.6,<5", "rtree>=1.3,<2", "scipy>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "manifold3d>=3,<4"]
report = ["matplotlib>=3.10,<4", "imageio-ffmpeg>=0.6,<1"]
agent = ["openai-codex>=0.154.0,<0.155"]

[project.scripts]
cncsim = "cncsim.__main__:main"
camloop = "camloop.__main__:main"

[tool.setuptools.packages.find]
include = ["cncsim*", "camloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
