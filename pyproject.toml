[project]
name = "silta-squad"
version = "0.1.0"
description = "CoreWeave Hacks team starter with W&B Weave tracing"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cadquery-ocp>=7.8,<8",
  "cwsandbox==1.14.2",
  "httpx>=0.28,<1",
  "marimo>=0.24.2",
  "numpy>=2,<3",
  "openai-codex>=0.154.0",
  "pillow>=11,<13",
  "python-dotenv>=1,<2",
  "rtree>=1.3,<2",
  "scipy>=1.12,<2",
  "shapely>=2,<3",
  "trimesh>=4.6,<5",
  "weave[wandb]>=0.52,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
