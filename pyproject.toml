[project]
name = "silta-squad"
version = "0.1.0"
description = "CoreWeave Hacks team starter with W&B Weave tracing"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "weave>=0.52,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
slides = ["marimo==0.24.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
