<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>SILTA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#7d807a}main{position:relative;width:100%;height:100svh;overflow:hidden}img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}img[hidden]{display:none}img.stale{opacity:.12}#notice{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:18px;padding:24px}#notice[hidden]{display:none}button{justify-self:center;border:1px solid #dedfdc;border-radius:5px;background:#fff;color:inherit;padding:9px 14px;cursor:pointer}
</style></head><body><main><img id="frame" hidden alt="Current part"><div id="notice"><span id="message">Connecting…</span><button id="reconnect" hidden>Reconnect</button></div></main>
<script>
const $=s=>document.querySelector(s);let streaming=false;
function unavailable(message){streaming=false;$('#frame').removeAttribute('src');$('#notice').hidden=false;$('#message').textContent=message;$('#reconnect').hidden=false;$('#frame').className='stale'}
async function state(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(d.status==='live'&&!document.hidden){if(!streaming){streaming=true;$('#frame').src='/stream.mjpg?t='+Date.now();$('#frame').hidden=false;$('#frame').className='';$('#notice').hidden=true;$('#reconnect').hidden=true}}else unavailable(d.status==='ended'?'This session has ended.':'Reconnecting…')}catch(e){unavailable('Reconnecting…')}setTimeout(state,1000)}
$('#frame').onerror=()=>unavailable('Reconnecting…');document.addEventListener('visibilitychange',()=>{if(document.hidden)unavailable('Reconnecting…')});$('#reconnect').onclick=()=>location.reload();state();
</script></body></html>
